<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ThirdWave SMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    
    <style>
        :root { --primary-blue: #0A4B9C; --bg-color: #F8F9FA; --text-main: #1F2937; --text-muted: #6B7280; --border-color: #E5E7EB; --font-family: 'Inter', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-family); background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background-color: #FFFFFF; width: 100%; max-width: 420px; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); }
        .login-header { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .login-header img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
        .login-header h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary-blue); margin-bottom: 4px; }
        .login-header p { font-size: 0.9rem; color: var(--text-muted); }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; font-weight: 500; color: var(--text-main); }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-family); font-size: 0.95rem; color: var(--text-main); outline: none; transition: border-color 0.2s ease; background-color: #FAFAFA; }
        .form-control:focus { border-color: var(--primary-blue); background-color: #FFFFFF; }
        .btn-signin { width: 100%; background-color: var(--primary-blue); color: white; border: none; padding: 14px; border-radius: 30px; font-size: 1rem; font-weight: 600; font-family: var(--font-family); cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-signin:hover { background-color: #083B7A; }
        .error-message { display: none; background-color: #FEE2E2; color: #B91C1C; padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-bottom: 15px; border: 1px solid #F87171; word-wrap: break-word; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <img src="https://raw.githubusercontent.com/veronica-fish/thirdwave/main/third.jpg" alt="ThirdWave SMS Logo">
            <h1>ThirdWave SMS</h1>
            <p>Telecom Management Platform</p>
        </div>

        <form id="loginForm">
            <div class="error-message" id="errorMessage">Username atau Password salah!</div>

            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn-signin" id="btnLogin">Sign In</button>
        </form>
    </div>

    <script>
        const client = new Appwrite.Client();
        client.setEndpoint('https://fra.cloud.appwrite.io/v1').setProject('6adce24f00120ccc01ce');
        const account = new Appwrite.Account(client);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const btnLogin = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMessage');
            let inputUser = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            btnLogin.textContent = 'Checking...';
            btnLogin.disabled = true;
            errorMsg.style.display = 'none';

            // Ubah username menjadi format email jika tidak ada '@'
            if (!inputUser.includes('@')) {
                inputUser = inputUser + '@thirdwave.cc';
            }

            try {
                // 1. Coba hapus sesi lama (jika ada)
                await account.deleteSession('current').catch(() => {});
                
                // 2. Proses login ke Appwrite
                await account.createEmailPasswordSession(inputUser, pass);
                
                // JIKA BERHASIL LOGIN:
                if (inputUser === 'dons1@thirdwave.cc') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }

            } catch (error) {
                console.error("Appwrite Error:", error);
                
                // --- MENAMPILKAN PESAN ERROR SPESIFIK ---
                let pesanError = "Terjadi kesalahan.";
                
                if (error.message.includes("Failed to fetch") || error.message.includes("NetworkError")) {
                    pesanError = "Error Jaringan/CORS: Pastikan domain sudah didaftarkan di menu 'Platforms' Appwrite.";
                } else if (error.message.includes("Invalid credentials")) {
                    pesanError = "Email/Password salah. Pastikan akun dons1@thirdwave.cc dibuat dengan password yang benar di Appwrite Console.";
                } else if (error.message.includes("Creation of a session is prohibited")) {
                    pesanError = "Sesi masih aktif. Silakan muat ulang halaman (Refresh) atau hapus sesi di Appwrite Console.";
                } else {
                    pesanError = error.message; // Tampilkan pesan asli dari Appwrite
                }
                
                errorMsg.textContent = pesanError;
                errorMsg.style.display = 'block';
            } finally {
                btnLogin.textContent = 'Sign In';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
